services:
  zoplanner-database:
    image: postgres:16-alpine
    container_name: zoplanner-database
    environment:
      POSTGRES_DB: ${DB_NAME:-zoplanner}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zoplanner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      - HOST=${DB_HOST:-zoplanner-database}
      - PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-test123}
      - POSTGRES_DB=${DB_NAME:-zoplanner}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL}
      - AWS_SES_FROM_NAME=${AWS_SES_FROM_NAME}
      - SNS_TOPIC_EMAIL_ARN=${SNS_TOPIC_EMAIL_ARN}
      - SNS_TOPIC_EVENTS_ARN=${SNS_TOPIC_EVENTS_ARN}
    env_file:
      - .env
    depends_on:
      zoplanner-database:
        condition: service_healthy
    networks:
      - zoplanner-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  zoplanner-network:
    driver: bridge
