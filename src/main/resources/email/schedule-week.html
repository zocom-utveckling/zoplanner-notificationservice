<!DOCTYPE html>
<html lang="sv">
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Segoe UI, Roboto, Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
    <tr>
        <td align="center" style="padding:24px 16px;">

            <table width="700" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">

                <tr>
                    <td style="padding:24px;">
                        <table width="100%">
                            <tr>
                                <td>
                                    <div style="font-size:20px; font-weight:700; color:#111827;">
                                        ZoPlanner
                                    </div>
                                    <div style="font-size:12px; color:#6b7280;">
                                        Veckoschema
                                    </div>
                                </td>
                                <td align="right">
                                    <div style="font-size:18px; font-weight:700; color:#111827;">
                                        {{weekRange}}
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 16px 24px; font-size:14px; color:#374151;">
                        Lärare:
                        <strong>{{teacherName}}</strong>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 20px 24px; font-size:14px; color:#4b5563;">
                        Här är ditt schema för veckan.
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 24px 24px;">
                        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#ffffff;">
                                    {{day1}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#ffffff;">
                                    {{day2}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#ffffff;">
                                    {{day3}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#ffffff;">
                                    {{day4}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#ffffff;">
                                    {{day5}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#fafafa;">
                                    {{day6}}
                                </td>
                            </tr>
                            <tr><td style="height:12px;"></td></tr>

                            <tr>
                                <td style="padding:16px; border:1px solid #e5e7eb; border-radius:10px; background:#fafafa;">
                                    {{day7}}
                                </td>
                            </tr>

                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 20px 24px;">
                        <table>
                            <tr>
                                <td style="background:#111827; border-radius:10px;">
                                    <a href="{{ctaUrl}}"
                                       style="display:inline-block; padding:12px 16px; color:#ffffff; text-decoration:none; font-weight:600;">
                                        Öppna i ZoPlanner
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:12px 24px 20px 24px; font-size:12px; color:#6b7280;">
                        Du får detta mail eftersom du har notifieringar aktiverade i ZoPlanner.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
