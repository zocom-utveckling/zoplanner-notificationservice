spring.application.name=notification-service
# Databasanslutning/ Fixa dessa credentials från den andra Java klassen som gjort CRUD-API eller ska vi göra egna?
# PostgreSQL kör på port: 5432 normalt och localhost för spring boot är ju port: 8080
spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/zoplanner 
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate-inställningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Visa SQL-frågor (utvecklingsläge)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Använder Port 8081 för att undvika konflikt med CRUD-API (port 8080), om det är fel kom gärna med input
server.port=8081

# AWS Konfiguration(Fylls i senare när vi har skapat dem tjänsterna på AWS)
# AWS Region (Stockholm)
aws.region=eu-north-1

# AWS SQS - Queue URL vart CRUD-API/Affärslogik postar events
aws.sqs.queue.url=

# AWS SNS - Topic ARN för email notifikationer
aws.sns.topic.email=

# AWS SNS - Topic ARN för SMS notifikationer
aws.sns.topic.sms=

## Valfritt att ändra dem 3 sista aws punkterna om ni har ett bättre sätt :)