spring.application.name=notification-service
# Databasanslutning
spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/zoplanner 
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate-installningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Visa SQL-fragor (utvecklingslage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Anvander Port 8082 for att undvika konflikt med CRUD-API (port 8080)
server.port=8082
# AWS Konfiguration
# AWS Region (Stockholm)
aws.region=eu-north-1
# AWS SQS - Queue URL vart CRUD-API/Affarslogik postar events
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:}
# AWS SQS Consumer - Polling settings
aws.sqs.polling.enabled=${AWS_SQS_POLLING_ENABLED:true}
aws.sqs.max.messages=${AWS_SQS_MAX_MESSAGES:10}
aws.sqs.wait.time.seconds=${AWS_SQS_WAIT_TIME_SECONDS:20}
# AWS SES - Email Configuration
# Verifierad avsandaradress i AWS SES (maste verifieras i SES Console)
aws.ses.from.email=${AWS_SES_FROM_EMAIL:noreply@zoplanner.com}
aws.ses.from.name=${AWS_SES_FROM_NAME:ZoPlanner Notifications}
# Configuration set for att spara email metrics (optional)
aws.ses.configuration.set=${AWS_SES_CONFIGURATION_SET:}
# AWS SNS - Topic ARN for email notifikationer (deprecated - anvand SES istallet)
aws.sns.topic.email=arn:aws:sns:eu-north-1:084828590879:Zoplanner
# AWS SNS - Topic ARN for SMS notifikationer
aws.sns.topic.sms=
logging.level.root=INFO

notification.audit.log-file=/app/notification-logs/notifications.log
