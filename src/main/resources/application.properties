spring.application.name=notification-service

# Database Connection
spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/zoplanner
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.mapper.accept-case-insensitive-properties=true

# Show SQL queries (development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use Port 8082 to avoid conflict with CRUD API (port 8080)
server.port=8082

# AWS Configuration
aws.region=${AWS_REGION:eu-north-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}

# AWS SQS - Queue URL
aws.sqs.queue.url=${SQS_QUEUE_URL}

# AWS SQS Consumer - Polling settings
aws.sqs.polling.enabled=true
aws.sqs.max.messages=10
aws.sqs.wait.time.seconds=20

# Notification Publisher
notification.publisher=${NOTIFICATION_PUBLISHER:sns}

# AWS SES - Email Configuration
aws.ses.from.email=${AWS_SES_FROM_EMAIL:noreply@zoplanner.com}
aws.ses.from.name=${AWS_SES_FROM_NAME:ZoPlanner Notifications}
aws.ses.configuration.set=${AWS_SES_CONFIGURATION_SET:}


# AWS SNS - Topic ARN for email notifikationer (deprecated - anvand SES istallet)
aws.sns.topic.email=${SNS_TOPIC_EMAIL_ARN}
aws.sns.topic.events=${SNS_TOPIC_EVENTS_ARN}

# AWS SNS - Topic ARN for SMS notifikationer
aws.sns.topic.sms=
logging.level.root=INFO

# Logging
logging.level.root=INFO
notification.audit.log-file=/app/notification-logs/notifications.log

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

