spring.application.name=notification-service
# Databasanslutning
spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/zoplanner 
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate-inställningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Visa SQL-frågor (utvecklingsläge)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Använder Port 8081 för att undvika konflikt med CRUD-API (port 8080)
server.port=8081
# AWS Konfiguration
# AWS Region (Stockholm)
aws.region=eu-north-1
# AWS SQS - Queue URL vart CRUD-API/Affärslogik postar events
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:}
# AWS SES - Email Configuration
# Verifierad avsändaradress i AWS SES (måste verifieras i SES Console)
aws.ses.from.email=${AWS_SES_FROM_EMAIL:noreply@zoplanner.com}
aws.ses.from.name=${AWS_SES_FROM_NAME:ZoPlanner Notifications}
# Configuration set för att spåra email metrics (optional)
aws.ses.configuration.set=${AWS_SES_CONFIGURATION_SET:}
# AWS SNS - Topic ARN för email notifikationer (deprecated - använd SES istället)
aws.sns.topic.email=
# AWS SNS - Topic ARN för SMS notifikationer
aws.sns.topic.sms=