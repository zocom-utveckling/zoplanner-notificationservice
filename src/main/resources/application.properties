spring.application.name=notification-service

# Database settings (can be updated later)
spring.datasource.url=jdbc:postgresql://${HOST}:${PORT}/zoplanner
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port (change to 8081 if needed)
server.port=8080

# Notification audit log file location
notification.audit.log-file=notification-logs/notifications.log
